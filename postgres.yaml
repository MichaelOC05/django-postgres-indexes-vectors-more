services:
  db:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_DB: testing-database
    ports:
      - "5432:5432"
    shm_size: 128mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-vector.sql:/docker-entrypoint-initdb.d/init-vector.sql

volumes:
  pgdata: